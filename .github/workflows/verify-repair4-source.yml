name: Verify Repair4 source artifact

on:
  push:
    branches: [main]
    paths:
      - "artifacts/UI23-REPAIR4/SG-PANEL-FIX40-UI23-REPAIR4-SOURCE.zip"
      - "artifacts/UI23-REPAIR4/SG-PANEL-FIX40-UI23-REPAIR4-SHA256.txt"
      - "artifacts/UI23-REPAIR4/SG-PANEL-FIX40-UI23-REPAIR4-XRAY-RADIO-FIX1.run"
      - "artifacts/UI23-REPAIR4/SG-PANEL-FIX40-FULL-UI23-REPAIR4-XRAY-RADIO-FIX1.run"
      - "artifacts/UI23-REPAIR4/SG-PANEL-FIX40-UI23-REPAIR4-XRAY-RADIO-FIX1-AUDIT.txt"
      - ".github/workflows/verify-repair4-source.yml"
  pull_request:
    branches: [main]
    paths:
      - "artifacts/UI23-REPAIR4/SG-PANEL-FIX40-UI23-REPAIR4-SOURCE.zip"
      - "artifacts/UI23-REPAIR4/SG-PANEL-FIX40-UI23-REPAIR4-SHA256.txt"
      - "artifacts/UI23-REPAIR4/SG-PANEL-FIX40-UI23-REPAIR4-XRAY-RADIO-FIX1.run"
      - "artifacts/UI23-REPAIR4/SG-PANEL-FIX40-FULL-UI23-REPAIR4-XRAY-RADIO-FIX1.run"
      - "artifacts/UI23-REPAIR4/SG-PANEL-FIX40-UI23-REPAIR4-XRAY-RADIO-FIX1-AUDIT.txt"
      - ".github/workflows/verify-repair4-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify frozen Repair4 artifact integrity
        working-directory: artifacts/UI23-REPAIR4
        run: |
          set -Eeuo pipefail
          sha256sum -c SG-PANEL-FIX40-UI23-REPAIR4-SHA256.txt
          unzip -tq SG-PANEL-FIX40-UI23-REPAIR4-SOURCE.zip
          echo "Historical Repair4 artifact is intact."

      - name: Explain verification boundary
        run: |
          echo "The legacy Repair4 source is intentionally frozen."
          echo "Repository-to-package equality is verified by Verify current UI23 package."
