name: Verify current UI23 package

on:
  push:
    branches: [main]
    paths:
      - "xpanel/**"
      - "tests/**"
      - "deploy/**"
      - "install.sh"
      - "install-or-upgrade.sh"
      - "CURRENT-UI23-REPAIR4.md"
      - "GLOBAL-BUTTONS-PREVIEW3-OUTLINE-NOTES.md"
      - "artifacts/UI23-REPAIR4/**"
      - ".github/workflows/verify-current-ui23.yml"
  pull_request:
    branches: [main]
    paths:
      - "xpanel/**"
      - "tests/**"
      - "deploy/**"
      - "install.sh"
      - "install-or-upgrade.sh"
      - "CURRENT-UI23-REPAIR4.md"
      - "GLOBAL-BUTTONS-PREVIEW3-OUTLINE-NOTES.md"
      - "artifacts/UI23-REPAIR4/**"
      - ".github/workflows/verify-current-ui23.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify checksums and source archive
        working-directory: artifacts/UI23-REPAIR4
        run: |
          sha256sum -c SG-PANEL-FIX40-UI23-REPAIR4-GLOBAL-BUTTONS-PREVIEW3-OUTLINE-SHA256.txt
          unzip -tq SG-PANEL-FIX40-UI23-REPAIR4-GLOBAL-BUTTONS-PREVIEW3-OUTLINE-SOURCE.zip

      - name: Verify updater and full installer
        working-directory: artifacts/UI23-REPAIR4
        run: |
          chmod +x SG-PANEL-FIX40-UI23-REPAIR4-GLOBAL-BUTTONS-PREVIEW3-OUTLINE.run
          chmod +x SG-PANEL-FIX40-FULL-UI23-REPAIR4-GLOBAL-BUTTONS-PREVIEW3-OUTLINE.run
          ./SG-PANEL-FIX40-UI23-REPAIR4-GLOBAL-BUTTONS-PREVIEW3-OUTLINE.run --verify-only
          ./SG-PANEL-FIX40-FULL-UI23-REPAIR4-GLOBAL-BUTTONS-PREVIEW3-OUTLINE.run --verify-only

      - name: Compare embedded payloads
        working-directory: artifacts/UI23-REPAIR4
        shell: bash
        run: |
          set -Eeuo pipefail
          extract_payload() {
            local run_file="$1" output="$2" line
            line="$(awk '$0 == "__SG_PANEL_ARCHIVE_BELOW__" {print NR + 1; exit}' "$run_file")"
            test -n "$line"
            tail -n +"$line" "$run_file" > "$output"
          }
          extract_payload SG-PANEL-FIX40-UI23-REPAIR4-GLOBAL-BUTTONS-PREVIEW3-OUTLINE.run updater-payload.zip
          extract_payload SG-PANEL-FIX40-FULL-UI23-REPAIR4-GLOBAL-BUTTONS-PREVIEW3-OUTLINE.run full-payload.zip
          cmp -s updater-payload.zip SG-PANEL-FIX40-UI23-REPAIR4-GLOBAL-BUTTONS-PREVIEW3-OUTLINE-SOURCE.zip
          cmp -s full-payload.zip SG-PANEL-FIX40-UI23-REPAIR4-GLOBAL-BUTTONS-PREVIEW3-OUTLINE-SOURCE.zip
          cmp -s updater-payload.zip full-payload.zip

      - name: Compare archived source with repository
        shell: bash
        run: |
          set -Eeuo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          unzip -q artifacts/UI23-REPAIR4/SG-PANEL-FIX40-UI23-REPAIR4-GLOBAL-BUTTONS-PREVIEW3-OUTLINE-SOURCE.zip -d "$tmp/source"
          while IFS= read -r -d '' file; do
            rel="${file#"$tmp/source/"}"
            test -f "$rel"
            cmp -s "$file" "$rel"
          done < <(find "$tmp/source" -type f -print0)
          echo "Current UI23 source artifact matches the repository files."
