name: Verify packaged artifacts

on:
  push:
    branches: [main]
    paths:
      - "artifacts/UI23-REPAIR3/**"
      - ".github/workflows/verify-artifacts.yml"
  pull_request:
    branches: [main]
    paths:
      - "artifacts/UI23-REPAIR3/**"
      - ".github/workflows/verify-artifacts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify published SHA-256 values
        working-directory: artifacts/UI23-REPAIR3
        run: sha256sum -c SG-PANEL-FIX40-UI23-REPAIR3-FINAL-SHA256.txt

      - name: Verify source ZIP integrity
        working-directory: artifacts/UI23-REPAIR3
        run: |
          unzip -tq SG-PANEL-FIX40-UI23-REPAIR3-FINAL-SOURCE.zip
          unzip -tq SG-PANEL-FIX40-FULL-UI23-REPAIR3-SOURCE.zip

      - name: Verify autonomous installers
        working-directory: artifacts/UI23-REPAIR3
        run: |
          chmod +x SG-PANEL-FIX40-UI23-REPAIR3.run
          chmod +x SG-PANEL-FIX40-FULL-UI23-REPAIR3.run
          ./SG-PANEL-FIX40-UI23-REPAIR3.run --verify-only
          ./SG-PANEL-FIX40-FULL-UI23-REPAIR3.run --verify-only

      - name: Compare embedded payloads with preserved source
        working-directory: artifacts/UI23-REPAIR3
        shell: bash
        run: |
          set -Eeuo pipefail
          extract_payload() {
            local run_file="$1"
            local output="$2"
            local line
            line="$(awk '$0 == "__SG_PANEL_ARCHIVE_BELOW__" {print NR + 1; exit}' "$run_file")"
            test -n "$line"
            tail -n +"$line" "$run_file" > "$output"
          }

          extract_payload SG-PANEL-FIX40-UI23-REPAIR3.run updater-payload.zip
          extract_payload SG-PANEL-FIX40-FULL-UI23-REPAIR3.run full-payload.zip

          cmp -s updater-payload.zip SG-PANEL-FIX40-UI23-REPAIR3-FINAL-SOURCE.zip
          cmp -s full-payload.zip SG-PANEL-FIX40-FULL-UI23-REPAIR3-SOURCE.zip
          cmp -s updater-payload.zip full-payload.zip

          echo "Both embedded payloads match the preserved Repair3 source byte-for-byte."
