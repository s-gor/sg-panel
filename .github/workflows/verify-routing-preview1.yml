name: Verify Routing Preview1 installers

on:
  push:
    branches: [main]
    paths:
      - "xpanel/service.py"
      - "xpanel/web.py"
      - "xpanel/templates/routing.html"
      - "xpanel/templates/base.html"
      - "xpanel/static/routing-unified-preview1.css"
      - "tests/test_preview9_fix40_routing_gateway_preview1.py"
      - "ROUTING-GATEWAY-PREVIEW1-NOTES.md"
      - "artifacts/UI23-REPAIR4-ROUTING-PREVIEW1/**"
      - ".github/workflows/verify-routing-preview1.yml"
  pull_request:
    branches: [main]
    paths:
      - "xpanel/service.py"
      - "xpanel/web.py"
      - "xpanel/templates/routing.html"
      - "xpanel/templates/base.html"
      - "xpanel/static/routing-unified-preview1.css"
      - "tests/test_preview9_fix40_routing_gateway_preview1.py"
      - "ROUTING-GATEWAY-PREVIEW1-NOTES.md"
      - "artifacts/UI23-REPAIR4-ROUTING-PREVIEW1/**"
      - ".github/workflows/verify-routing-preview1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify checksums and source ZIP
        working-directory: artifacts/UI23-REPAIR4-ROUTING-PREVIEW1
        run: |
          sha256sum -c SG-PANEL-FIX40-UI23-REPAIR4-ROUTING-PREVIEW1-SHA256.txt
          unzip -tq SG-PANEL-FIX40-UI23-REPAIR4-ROUTING-PREVIEW1-SOURCE.zip

      - name: Verify updater and full installer
        working-directory: artifacts/UI23-REPAIR4-ROUTING-PREVIEW1
        run: |
          chmod +x SG-PANEL-FIX40-UI23-REPAIR4-ROUTING-PREVIEW1.run
          chmod +x SG-PANEL-FIX40-FULL-UI23-REPAIR4-ROUTING-PREVIEW1.run
          ./SG-PANEL-FIX40-UI23-REPAIR4-ROUTING-PREVIEW1.run --verify-only
          ./SG-PANEL-FIX40-FULL-UI23-REPAIR4-ROUTING-PREVIEW1.run --verify-only

      - name: Compare embedded payloads and repository source
        working-directory: artifacts/UI23-REPAIR4-ROUTING-PREVIEW1
        shell: bash
        run: |
          set -Eeuo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          extract_payload() {
            local run_file="$1" output="$2" line
            line="$(awk '$0 == "__SG_PANEL_ARCHIVE_BELOW__" {print NR + 1; exit}' "$run_file")"
            test -n "$line"
            tail -n +"$line" "$run_file" > "$output"
          }

          extract_payload SG-PANEL-FIX40-UI23-REPAIR4-ROUTING-PREVIEW1.run "$tmp/updater.zip"
          extract_payload SG-PANEL-FIX40-FULL-UI23-REPAIR4-ROUTING-PREVIEW1.run "$tmp/full.zip"
          cmp -s "$tmp/updater.zip" SG-PANEL-FIX40-UI23-REPAIR4-ROUTING-PREVIEW1-SOURCE.zip
          cmp -s "$tmp/full.zip" SG-PANEL-FIX40-UI23-REPAIR4-ROUTING-PREVIEW1-SOURCE.zip
          cmp -s "$tmp/updater.zip" "$tmp/full.zip"

          unzip -q SG-PANEL-FIX40-UI23-REPAIR4-ROUTING-PREVIEW1-SOURCE.zip -d "$tmp/source"
          cd "$GITHUB_WORKSPACE"
          while IFS= read -r -d '' file; do
            rel="${file#"$tmp/source/"}"
            test -f "$rel"
            cmp -s "$file" "$rel"
          done < <(find "$tmp/source" -type f -print0)

          echo "Routing Preview1 artifacts and repository source match byte-for-byte."
